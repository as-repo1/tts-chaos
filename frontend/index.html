<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTS Chaos Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar glass">
    <h1>TTS Chaos</h1>
    <div class="nav-item active" data-tab="studio">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
      Studio
    </div>
    <div class="nav-item" data-tab="models">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
      Models
    </div>
    <div class="nav-item" data-tab="library">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      Library
    </div>
  </aside>

  <!-- Main Content Area -->
  <main>
    
    <!-- STUDIO TAB -->
    <section id="tab-studio" class="tab-content active">
      <h2>Voice Studio</h2>
      <div class="glass" style="padding: 32px; max-width: 800px;">
        <form id="voice-form">
          
          <div class="form-group">
            <label>Text to synthesize</label>
            <textarea id="text" name="text" rows="4" placeholder="Enter text here..." required></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label>Model</label>
              <select id="model-id" name="model_id">
                <option value="">Auto Select (Best Available)</option>
              </select>
              <div id="auto-hint" style="font-size: 12px; color: var(--highlight); margin-top: 8px;"></div>
            </div>
            
            <div class="form-group">
              <label>Voice</label>
              <select id="voice-id" name="voice_id">
                <option value="auto">Default for Model</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label>Language</label>
              <select id="language" name="language">
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
              </select>
            </div>

            <div class="form-group">
              <label>Speed (0.5 - 2.0)</label>
              <input type="number" id="speed" name="speed" value="1.0" step="0.1" min="0.5" max="2.0">
            </div>

            <div class="form-group">
              <label>Pitch (-10 to +10)</label>
              <input type="number" id="pitch" name="pitch" value="0" step="1" min="-10" max="10">
            </div>
          </div>

          <div class="form-group">
            <label>Save as Name</label>
            <input type="text" id="voice-name" name="voice_name" value="Generated Voice" required>
          </div>

          <div style="display: flex; align-items: center; gap: 20px; margin-top: 32px;">
            <button type="submit" class="btn" id="generate-btn">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Generate Audio
            </button>
            <div id="studio-waveform" class="waveform" style="display: none;">
              <div class="waveform-bar"></div>
              <div class="waveform-bar"></div>
              <div class="waveform-bar"></div>
              <div class="waveform-bar"></div>
              <div class="waveform-bar"></div>
              <div class="waveform-bar"></div>
            </div>
          </div>

        </form>
      </div>
    </section>

    <!-- MODELS TAB -->
    <section id="tab-models" class="tab-content">
      <h2>Model Catalog</h2>
      <div id="models-grid" class="models-grid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- LIBRARY TAB -->
    <section id="tab-library" class="tab-content">
      <h2>Voice Library</h2>
      <div id="library-list" class="voices-list" style="max-width: 800px;">
        <!-- Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
